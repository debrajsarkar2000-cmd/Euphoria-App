name: Build Euphoria Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          python3 scripts/build_app.py
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../EuphoriaLiveClasses.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Euphoria-Live-Classes-APK
          path: EuphoriaLiveClasses.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Euphoria Live Classes Mobile App v1.0.0"
          body: |
            ## 📱 Euphoria Live Classes Mobile App (v1.0.0)
            
            Welcome to the official Euphoria Live Classes Android App!
            
            ### ✨ Features Included:
            - **Complete Course Catalog**: Browse all 94+ masterclasses with instant filters and search.
            - **Secure DRM Video Player**: Prevents unauthorized recording and displays dynamic floating student watermarks.
            - **Protected PDF Recipe Viewer**: Interactive in-app canvas document reader with copyright protection.
            - **Offline-Ready & Fast**: Lightweight (~5.8 MB), blazing fast navigation compared to the slow website.
            - **1-Click WhatsApp VIP Support**: Direct line to chef and academy support.
            
            ### 📥 Installation Instructions:
            1. Tap on `EuphoriaLiveClasses.apk` below on your Android phone to download.
            2. Open the downloaded file and choose **Install** (if prompted, enable *"Allow from this source"*).
            3. Launch the app and enjoy your classes!
          draft: false
          prerelease: false
          files: EuphoriaLiveClasses.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

